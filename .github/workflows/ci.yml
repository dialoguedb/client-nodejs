name: CI

on:
  # push:
  #   branches: [main]
  pull_request:
    branches: [main, development]

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  run-tests-prerequisite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prerequisites for tests
        uses: ./.github/actions/prerequisites

  test:
    runs-on: ubuntu-latest
    needs: run-tests-prerequisite
    if: ${{ !(github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.ref == 'bump-version-branch') }}
    env:
       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4
      - name: Prerequisites for tests
        uses: ./.github/actions/prerequisites

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build:package

      - name: Run tests
        run: npm test

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: [run-tests-prerequisite, test] # run after prerequisite and test
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Prerequisites for tests
        uses: ./.github/actions/prerequisites

      - name: Build package
        run: npm run build:package

      - name: Pack (dry run)
        run: npm pack --dry-run
