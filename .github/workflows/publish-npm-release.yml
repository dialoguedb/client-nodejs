name: Publish Main/Beta Package To Npm Registry

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read
  
jobs:   
  publish-npm:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Publisher
        run: |
          ALLOWED_PUBLISHERS="gregreindel"
          if [[ ! ",$ALLOWED_PUBLISHERS," =~ ",${{ github.actor }}," ]]; then
            echo "Error: User ${{ github.actor }} is not authorized to publish packages"
            echo "Allowed publishers: $ALLOWED_PUBLISHERS"
            exit 1
          fi
          echo "User ${{ github.actor }} is authorized to publish"
      

      - uses: actions/checkout@v4
      
      - name: Prerequisites for tests
        uses: ./.github/actions/prerequisites

      - name: Verify package can be built
        run: npm pack --dry-run

      - name: Publish Main/Beta Package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *"beta"* ]]; then
            echo "Publishing beta version"
            npm run publish-beta
          else
            echo "Publishing main version"
            npm run publish-main
          fi
          
          echo "✅ Package published successfully!"