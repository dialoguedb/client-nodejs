name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-4-6' }}

jobs:
  claude-review:
    if: ${{ !(github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.ref == 'bump-version-branch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify PR still open
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
          if [ "$STATE" = "OPEN" ]; then
            echo "is_open=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_open=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PR #${{ github.event.pull_request.number }} is $STATE — skipping LLM"
          fi

      - name: Run Claude Code Review
        if: steps.verify.outputs.is_open == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this pull request. Read the diff with `gh pr diff` and focus only on the changes in this PR.
            Look for:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Output format: ONE summary comment posted via `gh pr comment`. Structure it as:
            - A one-line verdict (LGTM / needs changes / questions).
            - Then, if you found issues, a short bulleted list where each bullet names the file and the specific concern (e.g. "`src/api/message.ts:42` - the retry path swallows the error"), with a concrete suggestion. The file and line reference in the bullet text is how a reviewer finds it; do not leave inline comments.
            - If the change looks good, one to two sentences and stop.

            Be constructive and terse. Do not reference any issue or PR unrelated to this one.

          allowed_bots: "dependabot[bot]"