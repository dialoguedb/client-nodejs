name: 'Prerequisites for tests'
description: 'Consolidated prerequisite steps for tests'
runs:
  using: 'composite'
  steps:
      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node
        
      - name: Cache npm dependencies and node modules
        uses: ./.github/actions/cache
        
      - name: Install
        shell: bash
        run: npm install